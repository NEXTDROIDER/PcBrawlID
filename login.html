<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PcBrawl ID</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
font-family:Segoe UI,Arial,sans-serif;color:#fff;
background:radial-gradient(ellipse at top,#354f91,#192440 52%,#0b1020)}
.card{width:100%;max-width:410px;padding:30px;border-radius:24px;
background:#202b46;border:1px solid #46577b;box-shadow:0 24px 70px #0007}
.logo{text-align:center;font-size:42px}h1{text-align:center;margin:6px 0}
.sub{text-align:center;color:#b9c7e5;margin-bottom:24px}
label{display:block;margin:16px 0 7px;color:#dbe5ff;font-size:14px}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #52658b;
background:#121b30;color:#fff;font-size:16px}
button{width:100%;padding:13px;margin-top:15px;border:0;border-radius:10px;
background:#ffd34e;color:#25283a;font-size:16px;font-weight:bold;cursor:pointer}
.secondary{background:#394969;color:#fff;margin-top:10px}
#status{min-height:22px;overflow-wrap:anywhere;text-align:center;color:#ffd875;font-size:14px}
#account{display:none;text-align:center}
.small{text-align:center;color:#9eafd2;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<main class="card">
<div class="logo">⭐</div>
<h1>PcBrawl ID</h1>
<p class="sub">Один аккаунт для твоей игры</p>

<section id="auth">
<form id="form">
<label for="username">Логин</label>
<input id="username" autocomplete="username" minlength="3" maxlength="24"
pattern="[A-Za-z0-9_]+" required placeholder="Например, Amber_20">
<label for="password">Пароль</label>
<input id="password" type="password" autocomplete="current-password"
minlength="8" maxlength="128" required placeholder="Минимум 8 символов">
<button id="submit" type="submit">Войти</button>
<button id="register" class="secondary" type="button">Создать аккаунт</button>
</form>
</section>

<section id="account">
<p>Ты вошёл как</p>
<h2 id="who"></h2>
<button id="logout" class="secondary">Выйти</button>
</section>
<p id="status" role="status"></p>
<p class="small">Собственная тестовая система аккаунтов PcBrawl. Не вводи пароль от Supercell ID.</p>
</main>
<script>
const $ = id => document.getElementById(id);
let mode = "login";
let token = sessionStorage.getItem("pcbr_token") || "";

$("register").onclick = () => {
  mode = "register";
  $("submit").textContent = "Зарегистрироваться";
  $("status").textContent = "Создай новый PcBrawl ID.";
};

async function api(path, data, auth = false) {
  const headers = {"Content-Type":"application/json"};
  if (auth && token) headers.Authorization = "Bearer " + token;
  const response = await fetch(path, {
    method:"POST", headers, body:JSON.stringify(data || {})
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || "Ошибка запроса");
  return result;
}

function showAccount(username) {
  $("auth").style.display = "none";
  $("account").style.display = "block";
  $("who").textContent = username;
  $("status").textContent = "Авторизация успешна.";
}

$("form").addEventListener("submit", async event => {
  event.preventDefault();
  $("status").textContent = "Проверяем аккаунт...";
  $("submit").disabled = true;
  try {
    const result = await api("/api/" + mode, {
      username:$("username").value,
      password:$("password").value
    });
    token = result.token;
    sessionStorage.setItem("pcbr_token", token);
    $("password").value = "";
    showAccount(result.username);
  } catch (err) {
    $("status").textContent = err.message;
  } finally {
    $("submit").disabled = false;
  }
});

$("logout").onclick = async () => {
  try { await api("/api/logout", {}, true); } catch {}
  token = "";
  sessionStorage.removeItem("pcbr_token");
  $("account").style.display = "none";
  $("auth").style.display = "block";
  $("status").textContent = "Ты вышел из аккаунта.";
  mode = "login";
  $("submit").textContent = "Войти";
};

(async () => {
  if (!token) return;
  try {
    const result = await api("/api/me", {}, true);
    showAccount(result.username);
  } catch {
    token = "";
    sessionStorage.removeItem("pcbr_token");
  }
})();
</script>
</body>
</html>
