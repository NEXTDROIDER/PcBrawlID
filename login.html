<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nextdroider ID</title>
<style>
body{background:#111218;color:#f5f5fa;font:16px Arial;display:grid;place-items:center;min-height:95vh;margin:0}
main{width:min(340px,85vw);padding:26px;background:#20212b;border-radius:16px}
input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:12px;border-radius:8px}
input{background:#12131a;color:white;border:1px solid #454653}
button{background:#625df5;color:white;border:0;cursor:pointer;font-weight:bold}
#message{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h2>Nextdroider ID</h2>
<p>Вход или регистрация аккаунта</p>
<input id="username" placeholder="Имя пользователя" autocomplete="username">
<input id="password" type="password" placeholder="Пароль" autocomplete="current-password">
<button onclick="send('/api/login')">Войти</button>
<button onclick="send('/api/register')">Зарегистрироваться</button>
<p id="message"></p>
<script>
const API_BASE = "https://pcbrawlid.onrender.com";

async function send(endpoint) {
  const message = document.getElementById("message");
  message.textContent = "Подключение...";
  try {
    if (API_BASE.includes("YOUR-SERVICE")) {
      throw new Error("Укажи адрес своего Render-сервиса в login.html");
    }

    const response = await fetch(API_BASE + endpoint, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value
      })
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Ошибка входа");

    message.textContent = "Успешно! Аккаунт: " + result.user.username +
      ". ID: " + result.user.id;
  } catch (error) {
    message.textContent = error.message || "Не удалось подключиться";
  }
}
</script>
</main>
</body>
</html>
